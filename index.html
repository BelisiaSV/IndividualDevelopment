<script>
// ============================================================
// BELISIA SV — SUPABASE CLIENT v5 (role fix)
// ============================================================
const SUPABASE_URL = window.SUPABASE_URL || 'https://JOUW-PROJECT-ID.supabase.co';
const SUPABASE_KEY = window.SUPABASE_KEY || 'JOUW-ANON-KEY';

const sb = {
  token: null, userId: null,
  h(x={}) { return {'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${this.token||SUPABASE_KEY}`,...x}; },
  async signUp(email,pass,name) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/signup`,{method:'POST',headers:this.h(),body:JSON.stringify({email,password:pass,data:{name}})});
    return r.json();
  },
  async signIn(email,pass) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:this.h(),body:JSON.stringify({email,password:pass})});
    const d = await r.json();
    if(d.access_token){
      this.token=d.access_token;
      this.userId=d.user.id;
      localStorage.setItem('sb_tok',d.access_token);
      localStorage.setItem('sb_uid',d.user.id);
      localStorage.setItem('sb_name', d.user.user_metadata?.name || d.user.email);
    }
    return d;
  },
  async signOut() {
    await fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:this.h()});
    this.token=null;this.userId=null;
    localStorage.removeItem('sb_tok');
    localStorage.removeItem('sb_uid');
    localStorage.removeItem('sb_name');
    localStorage.removeItem('sb_usr');
  },
  async me() {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:this.h()});
    return r.json();
  },
  q(table){ return new SbQuery(table); }
};

class SbQuery {
  constructor(t){this.t=t;this._f=[];this._s='*';this._o=null;this._l=null;}
  select(s){this._s=s;return this;}
  eq(c,v){this._f.push(`${c}=eq.${encodeURIComponent(v)}`);return this;}
  order(c,{asc=true}={}){this._o=`${c}.${asc?'asc':'desc'}`;return this;}
  limit(n){this._l=n;return this;}
  _url(){
    let u=`${SUPABASE_URL}/rest/v1/${this.t}?select=${this._s}`;
    this._f.forEach(f=>u+='&'+f);
    if(this._o)u+=`&order=${this._o}`;
    if(this._l)u+=`&limit=${this._l}`;
    return u;
  }
  async get(){
    const r=await fetch(this._url(),{headers:sb.h({'Accept':'application/json'})});
    const d=await r.json();
    return{data:Array.isArray(d)?d:[],error:d.error||null};
  }
  async insert(data){
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${this.t}`,{method:'POST',headers:sb.h({'Prefer':'return=representation'}),body:JSON.stringify(Array.isArray(data)?data:[data])});
    const d=await r.json();
    return{data:Array.isArray(d)?d[0]:d,error:d.error||null};
  }
  async update(data,id){
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${this.t}?id=eq.${id}`,{method:'PATCH',headers:sb.h({'Prefer':'return=representation'}),body:JSON.stringify(data)});
    const d=await r.json();
    return{data:Array.isArray(d)?d[0]:d,error:d.error||null};
  }
  async del(id){
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${this.t}?id=eq.${id}`,{method:'DELETE',headers:sb.h()});
    return{error:r.ok?null:'failed'};
  }
  async upsert(data){
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${this.t}`,{method:'POST',headers:sb.h({'Prefer':'return=representation,resolution=merge-duplicates'}),body:JSON.stringify(Array.isArray(data)?data:[data])});
    const d=await r.json();
    return{data:d,error:d.error||null};
  }
}

const COLORS=['#4FA8D1','#2EAA6A','#D4860A','#7C5CBF','#E05252','#16A085','#E67E22','#2980B9','#8E44AD','#27AE60','#C0392B','#F39C12'];
const S={user:null,profile:null,players:[],kpis:[],principes:[],weekSessions:{},carriere:[],competenties:[],licenseTopics:[],reflecties:[],oefenvormen:[],activePlayer:null,activeWerkpuntId:null,activeLicenseTopic:null,weekOffset:0,charts:{}};

// isCoach reads directly from S.profile which is always loaded fresh from Supabase
const isCoach=()=>S.profile?.role==='coach';
const ini=name=>(name||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();

// ============================================================
// SYNC
// ============================================================
let syncTimer;
function syncing(v){
  const dot=document.getElementById('syncDot'),lbl=document.getElementById('syncLbl');
  if(!dot)return;
  if(v){dot.style.background='#D4860A';lbl.textContent='Opslaan...';}

function notify(msg='✓ Opgeslagen',col='#2EAA6A'){
  const n=document.getElementById('notif');
  if(!n)return;
  n.textContent=msg;n.style.borderLeftColor=col;n.style.display='flex';
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>n.style.display='none',2800);

// AUTH
// ============================================================
async function doLogin(){
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  const err=document.getElementById('lErr');
  if(!email||!pass){showErr(err,'Vul e-mail en wachtwoord in.');return;}
  const d=await sb.signIn(email,pass);
  if(!d.access_token){showErr(err,d.error?.message||'Login mislukt. Controleer je gegevens.');return;}
  await bootApp();
}
async function doRegister(){
  const name=document.getElementById('rName').value.trim();
  const email=document.getElementById('rEmail').value.trim();
  const pass=document.getElementById('rPass').value;
  const err=document.getElementById('rErr');
  if(!name||!email||!pass){showErr(err,'Vul alle velden in.');return;}
  if(pass.length<8){showErr(err,'Wachtwoord min. 8 tekens.');return;}
  const d=await sb.signUp(email,pass,name);
  if(d.error){showErr(err,d.error.message);return;}
  err.style.background='#D1FAE5';err.style.color='#065F46';
  err.textContent='✓ Account aangemaakt! Log nu in.';
  err.style.display='block';
  showLog();
}
function showErr(el,msg){el.textContent=msg;el.style.display='block';el.style.background='#FEE2E2';el.style.color='#991B1B';}
function showReg(){document.getElementById('loginView').style.display='none';document.getElementById('regView').style.display='block';}
function showLog(){document.getElementById('loginView').style.display='block';document.getElementById('regView').style.display='none';}
async function doLogout(){
  await sb.signOut();
  location.reload();
}

// ============================================================
// BOOT — altijd rol ophalen uit Supabase, nooit uit cache
// ============================================================
async function init(){
  // Support both old (sb_usr) and new (sb_uid) localStorage formats
  const tok = localStorage.getItem('sb_tok');
  let uid = localStorage.getItem('sb_uid');
  
  // Fallback: try to get uid from old sb_usr key
  if(!uid){
    try {
      const oldUsr = JSON.parse(localStorage.getItem('sb_usr')||'null');
      if(oldUsr?.id) uid = oldUsr.id;
    } catch(e){}
  }

  if(tok){
    sb.token = tok;
    // Always get fresh user data from Supabase auth
    const check = await sb.me();
    if(check.id){
      sb.userId = check.id;
      // Store in both formats for compatibility
      localStorage.setItem('sb_uid', check.id);
      localStorage.setItem('sb_tok', tok);
      await bootApp();
      return;
    }
    // Token expired
    await sb.signOut();
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('authWrap').style.display='flex';
}

async function bootApp(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('authWrap').style.display='none';
  
  // Safety net: als alles mislukt na 8 seconden, toon foutmelding
  const safetyTimer = setTimeout(()=>{
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;padding:20px;font-family:sans-serif">
        <div style="font-size:16px;font-weight:600;margin-bottom:8px;color:#161F2B">Verbinding mislukt</div>
        <div style="font-size:13px;color:#94A3B8;margin-bottom:16px">Controleer je Supabase URL en Key in index.html</div>
        <button onclick="location.reload()" style="padding:8px 16px;background:#4FA8D1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">Opnieuw proberen</button>
        <button onclick="doLogout()" style="padding:8px 16px;background:transparent;border:1px solid #DDE3EA;border-radius:8px;cursor:pointer;font-size:13px;margin-left:8px">Uitloggen</button>
      </div>`;
  }, 8000);

  // STAP 1: Haal vers profiel op via directe REST call met huidige token
  let profileLoaded = false;
  
  try {
    const profUrl = `${SUPABASE_URL}/rest/v1/profiles?id=eq.${sb.userId}&select=*`;
    const profResp = await fetch(profUrl, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${sb.token}`,
        'Accept': 'application/json'
      }
    });
    const profData = await profResp.json();
    if(Array.isArray(profData) && profData.length > 0){
      S.profile = profData[0];
      profileLoaded = true;
    }
  } catch(e){}

  if(!profileLoaded){
    // Profiel aanmaken als het niet bestaat
    const meData = await sb.me();
    const name = meData.user_metadata?.name || meData.email || 'Gebruiker';
    try {
      const insResp = await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${sb.token}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({id: sb.userId, name, role: 'player'})
      });
      const insData = await insResp.json();
      S.profile = Array.isArray(insData) ? insData[0] : insData;
    } catch(e){
      S.profile = {id: sb.userId, name: 'Gebruiker', role: 'player'};
    }
  }

  // STAP 2: Laad alle data - elke call heeft eigen foutafhandeling
  try {
    await Promise.all([
      loadPlayers().catch(e=>{ S.players=[]; }),
      loadKpis().catch(e=>{ S.kpis=[{id:'k1',name:'Passes %',unit:'pct',default_val:70}]; }),
      loadPrincipes().catch(e=>{ S.principes=[]; }),
      loadWeekSessions().catch(e=>{ S.weekSessions={}; }),
      loadCoachData().catch(e=>{ S.carriere=[];S.competenties=[];S.licenseTopics=[];S.reflecties=[]; }),
      loadOefenvormen().catch(e=>{ S.oefenvormen=[]; })
    ]);
  } catch(e) {
    // Ga door ook als data laden mislukt
  }

  // STAP 3: Render UI met correcte rol
  clearTimeout(safetyTimer);
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderSidebar();
  nav('dashboard', null);
}

// DATA LOADERS
// ============================================================
async function loadPlayers(){
  const{data:pl}=await sb.q('players').order('name').get();
  for(const p of(pl||[])){
    const[{data:wps},{data:pops},{data:wh},{data:inj}]=await Promise.all([
      sb.q('werkpunten').eq('player_id',p.id).get(),
      sb.q('pop_history').eq('player_id',p.id).order('created_at',{asc:false}).get(),
      sb.q('weight_history').eq('player_id',p.id).order('measured_at').get(),
      sb.q('injuries').eq('player_id',p.id).get()
    ]);
    p.werkpunten=(wps||[]).map(w=>({...w,principes:w.principes||[],acties:w.acties||[]}));
    p.popHistory=pops||[];
    p.weight=(wh||[]).map(w=>({d:new Date(w.measured_at).toLocaleDateString('nl-BE',{day:'numeric',month:'short'}),w:w.weight_kg}));
    if(!p.weight.length)p.weight=[{d:'Start',w:p.weight_kg||75}];
    p.injuries=inj||[];
    p.kpis=p.kpis||{};
    p.presence=p.presence||[];
  }
  S.players=pl||[];
}

async function loadKpis(){
  const{data}=await sb.q('kpis').order('created_at').get();
  if(data?.length){S.kpis=data;return;}
  const defs=[
    {id:'k1',name:'Passes geslaagd %',unit:'pct',default_val:70},
    {id:'k2',name:'Sprints p/90',unit:'num',default_val:60},
    {id:'k3',name:'Toplopen p/90',unit:'num',default_val:55},
    {id:'k4',name:'Afstand (km)',unit:'km',default_val:8}
  ];
  for(const k of defs)await sb.q('kpis').insert(k);
  S.kpis=defs;
}

async function loadPrincipes(){
  const{data}=await sb.q('principes').order('created_at').get();
  if(data?.length){S.principes=data;return;}
  const defs=[
    {label:'Passing in final third',color:'chip-blue'},
    {label:'Receiving under pressure',color:'chip-blue'},
    {label:'Finishing 1v1',color:'chip-green'},
    {label:'Schot op doel',color:'chip-green'},
    {label:'Pressing trigger',color:'chip-amber'},
    {label:'Compactheid verdediging',color:'chip-amber'},
    {label:'Balrecirculatie',color:'chip-blue'},
    {label:'Dieptepas timing',color:'chip-green'}
  ];
  for(const p of defs)await sb.q('principes').insert(p);
  S.principes=defs;
}

async function loadWeekSessions(){
  const{data}=await sb.q('week_sessions').order('week_offset').get();
  S.weekSessions={};
  (data||[]).forEach(r=>{
    if(!S.weekSessions[r.week_offset])S.weekSessions[r.week_offset]={};
    if(!S.weekSessions[r.week_offset][r.day_index])S.weekSessions[r.week_offset][r.day_index]=[];
    S.weekSessions[r.week_offset][r.day_index].push(r);
  });
}

async function loadCoachData(){
  const[{data:carr},{data:comp},{data:topics},{data:refs}]=await Promise.all([
    sb.q('carriere').order('sort_order').get(),
    sb.q('competenties').order('created_at').get(),
    sb.q('license_topics').order('created_at').get(),
    sb.q('reflecties').order('date',{asc:false}).get()
  ]);
  S.carriere=carr?.length?carr:[
    {year:'2024–heden',title:'Performance Coach',club:'Belisia SV',description:'Seniorenvoetbal'},
    {year:'2020',title:'UEFA B Licentie',club:'KBVB Brussel',description:''}
  ];
  S.competenties=(comp||[]).map(c=>c.name);
  for(const t of(topics||[])){
    const{data:vids}=await sb.q('license_videos').eq('topic_id',t.id).get();
    t.videos=vids||[];
  }
  S.licenseTopics=topics||[];
  S.reflecties=refs||[];
}

async function loadOefenvormen(){
  const{data}=await sb.q('oefenvormen').order('created_at').get();
  for(const o of(data||[])){
    const{data:h}=await sb.q('oef_load_history').eq('oefenvorm_id',o.id).order('session_date').get();
    o.loadHistory=h||[];
    o.principes=o.principes||[];
    o.load=o.load||{};
  }
  S.oefenvormen=data||[];
}

function renderSpelers(){
  const el=document.getElementById('pg-spelers');
  const lijnen={
    'Alle lijnen': null,
    'Keepers': ['GK'],
    'Verdedigers': ['CB','LB','RB','SW'],
    'Middenvelders': ['CDM','CM','CAM','DM'],
    'Aanvallers': ['LW','RW','ST','CF','SS']
  };
  el.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <input id="plSearch" class="sinput" placeholder="Speler zoeken op naam..." style="min-width:200px">
      <select id="lijnFilter" class="fsel">
        ${Object.keys(lijnen).map(l=>`<option value="${l}">${l}</option>`).join('')}
      </select>
      <select id="posFilter" class="fsel">
        <option value="">Alle posities</option>
        ${[...new Set(S.players.map(p=>p.pos))].sort().map(p=>`<option value="${p}">${p}</option>`).join('')}
      </select>
      <button class="btn bp sm" onclick="om('addSpeler')">+ Speler</button>
    </div>
    <div id="playerGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px"></div>`;

  // Gebruik addEventListener in plaats van oninput om re-render te voorkomen
  document.getElementById('plSearch').addEventListener('input', filterSpelers);
  document.getElementById('lijnFilter').addEventListener('change', filterSpelers);
  document.getElementById('posFilter').addEventListener('change', filterSpelers);
  filterSpelers();
}

function filterSpelers(){
  const q=(document.getElementById('plSearch')?.value||'').toLowerCase();
  const lijn=document.getElementById('lijnFilter')?.value||'Alle lijnen';
  const pos=document.getElementById('posFilter')?.value||'';
  const lijnen={'Keepers':['GK'],'Verdedigers':['CB','LB','RB','SW'],'Middenvelders':['CDM','CM','CAM','DM'],'Aanvallers':['LW','RW','ST','CF','SS']};
  const filtered=S.players.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q)&&!p.pos?.toLowerCase().includes(q))return false;
    if(lijn&&lijn!=='Alle lijnen'){const poses=lijnen[lijn]||[];if(!poses.includes(p.pos))return false;}
    if(pos&&p.pos!==pos)return false;
    return true;
  });
  const grid=document.getElementById('playerGrid');
  if(!grid)return;
  grid.innerHTML=filtered.map(p=>{
    const att=Math.round((p.presence||[]).filter(x=>x==='present').length/Math.max((p.presence||[]).length,1)*100);
    return`<div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;position:relative" onclick="openPlayer(${p.id})" onmouseenter="this.style.borderColor='#4FA8D1'" onmouseleave="this.style.borderColor='var(--brd)'">
      ${p.injury?'<span class="bdg red" style="position:absolute;top:10px;right:10px">Blessure</span>':''}
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:40px;height:40px;border-radius:50%;background:${p.color||'#4FA8D1'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0">${ini(p.name)}</div>
        <div><div style="font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--t3)">${p.pos||'—'} · ${p.age||'—'} jr</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
        ${[['Gewicht',(p.weight||[])[(p.weight||[]).length-1]?.w+' kg'],['Aanw.',att+'%'],['Werkpunten',(p.werkpunten||[]).length],["POP's",(p.popHistory||[]).length]].map(([l,v])=>`<div style="background:var(--bg);border-radius:6px;padding:5px 7px"><div style="font-size:10px;color:var(--t3)">${l}</div><div style="font-size:13px;font-weight:600">${v}</div></div>`).join('')}
      </div>
    </div>`;
  }).join('')||'<div style="color:var(--t3);font-size:13px;padding:20px">Geen spelers gevonden.</div>';
}

function openPlayer(id){
  S.activePlayer=id;
  const p=S.players.find(x=>x.id==id);if(!p)return;
  renderPlayerDetail(p);
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('pg-speler-detail').classList.add('active');
  document.getElementById('topTitle').textContent=p.name+' — '+(p.pos||'');
  document.getElementById('topActs').innerHTML=`<button class="btn bg sm" onclick="nav('spelers',null)">← Kern</button><button class="btn bp sm" onclick="om('addPop')">+ POP/PAP</button>`;
}
function openMyProfile(){const me=S.players.find(p=>p.profile_id===S.profile?.id);if(me)openPlayer(me.id);}

function renderPlayerDetail(p){
  const att=Math.round((p.presence||[]).filter(x=>x==='present').length/Math.max((p.presence||[]).length,1)*100);
  const mxW=Math.max(...(p.weight||[{w:75}]).map(x=>x.w)),mnW=Math.min(...(p.weight||[{w:75}]).map(x=>x.w));
  document.getElementById('pg-speler-detail').innerHTML=`
    <div style="background:var(--txt);border-radius:10px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;border-radius:50%;background:${p.color||'#4FA8D1'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff">${ini(p.name)}</div>
      <div><div style="font-family:var(--fc);font-size:22px;font-weight:700;color:#fff">${p.name}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.5)">${p.pos||'—'} · ${p.age||'—'} jaar · ${(p.weight||[])[(p.weight||[]).length-1]?.w||'—'} kg</div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${p.injury?'<span class="bdg red">Blessure</span>':''}${att<65?'<span class="bdg amber">Lage aanwezigheid</span>':''}</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'tp-ov')">Overzicht</div>
      <div class="tab" onclick="switchTab(this,'tp-wp')">Werkpunten</div>
      <div class="tab" onclick="switchTab(this,'tp-pop')">POP/PAP</div>
      <div class="tab" onclick="switchTab(this,'tp-aanw')">Aanwezigheid</div>
    </div>
    <div class="tp active" id="tp-ov">
      <div class="g2" style="margin-bottom:16px">
        <div class="card"><div class="ctitle">Gewicht</div>
          <div style="display:flex;align-items:flex-end;gap:8px;height:70px">
            ${(p.weight||[]).map(w=>{const h=mxW===mnW?40:Math.round(16+((w.w-mnW)/(mxW-mnW))*44);return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:100%;background:#4FA8D1;border-radius:4px 4px 0 0;height:${h}px;position:relative"><span style="position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;color:#2B7FA8;white-space:nowrap">${w.w}</span></div><div style="font-size:9px;color:var(--t3)">${w.d}</div></div>`;}).join('')}
          </div>
          ${isCoach()?`<div style="margin-top:14px;display:flex;gap:8px;align-items:flex-end">
            <div style="flex:1"><label style="font-size:12px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px">Nieuw gewicht (kg)</label>
            <input type="number" id="nwv" style="width:100%;padding:8px;font-size:13px;border:1px solid var(--brd);border-radius:7px;background:var(--bg)"></div>
            <button class="btn bp sm" onclick="doSaveWeight(${p.id})">Opslaan</button></div>`:''}
        </div>
        <div class="card"><div class="ctitle">KPI ${isCoach()?`<button class="btn bg xs" style="margin-left:auto" onclick="openEditKpi(${p.id})">✏ Bewerken</button>`:''}</div>
          ${S.kpis.map(k=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:3px;font-weight:500"><span>${k.name}</span><span>${p.kpis?.[k.id]||k.default_val}${k.unit==='pct'?'%':k.unit==='km'?' km':''}</span></div><div style="height:7px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;background:#4FA8D1;width:${Math.min(100,k.unit==='km'?(p.kpis?.[k.id]||k.default_val)/12*100:(p.kpis?.[k.id]||k.default_val))}%"></div></div></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="tp" id="tp-wp">
      ${isCoach()?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-weight:700">Principes (sleep naar werkpunt)</div><button class="btn bp sm" onclick="om('addWerkpunt')">+ Werkpunt</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--brd);min-height:44px;margin-bottom:12px">${S.principes.map(pr=>`<span class="chip ${pr.color}" draggable="true" data-label="${pr.label}" ondragstart="onDS(event)">${pr.label}</span>`).join('')}</div>`:''}
      <div id="wpl-${p.id}">${renderWPs(p)}</div>
    </div>
    <div class="tp" id="tp-pop">
      ${isCoach()?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-weight:700">Gesprekken</div><button class="btn bp sm" onclick="om('addPop')">+ Gesprek</button></div>`:''}
      <div id="popl-${p.id}">${renderPopList(p)}</div>
    </div>
    <div class="tp" id="tp-aanw">
      <div class="g2">
        <div class="card"><div class="ctitle">Kalender</div>
          <div style="display:flex;gap:10px;font-size:11px;margin-bottom:8px;flex-wrap:wrap">
            ${[['#D1FAE5','Aanwezig'],['#FEE2E2','Afwezig'],['#E6F4FB','Wedstrijd'],['#FEF3C7','Blessure']].map(([bg,l])=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:${bg};display:inline-block"></span>${l}</span>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
            ${(p.presence||[]).map((s,i)=>{const bg=s==='present'?'#D1FAE5':s==='absent'?'#FEE2E2':s==='injury'?'#FEF3C7':'#E6F4FB';const c=s==='present'?'#065F46':s==='absent'?'#991B1B':s==='injury'?'#92400E':'#2B7FA8';return`<div style="aspect-ratio:1;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:${c};cursor:${isCoach()?'pointer':'default'}" ${isCoach()?`onclick="togglePres(${p.id},${i})"`:''}>${i%2===0?'T':'W'}</div>`;}).join('')}
            ${isCoach()?`<div style="aspect-ratio:1;border-radius:4px;border:1px dashed var(--brd);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t3);cursor:pointer" onclick="addPres(${p.id})">+</div>`:''}
          </div>
        </div>
        <div class="card"><div class="ctitle">Blessures</div>
          ${(p.injuries||[]).map(inj=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--brd)"><div style="width:8px;height:8px;border-radius:50%;background:${inj.active?'#E05252':'#2EAA6A'};flex-shrink:0"></div><div><div style="font-size:13px;font-weight:600">${inj.type}</div><div style="font-size:11px;color:var(--t3)">${inj.date_start||''} · ${inj.active?'Actief':'Hersteld'}</div></div></div>`).join('')||'<div style="font-size:13px;color:var(--t3)">Geen blessures.</div>'}
        </div>
      </div>
    </div>`;
}

function renderWPs(p){
  if(!(p.werkpunten||[]).length)return`<div style="font-size:13px;color:var(--t3);padding:12px 0">Geen werkpunten.</div>`;
  return p.werkpunten.map(w=>`<div style="background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:14px;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="font-weight:600;font-size:14px;flex:1">${w.text}</div>
      <span class="bdg blue">${w.cat}</span>
      ${isCoach()?`<button class="btn bg xs" onclick="delWP(${p.id},'${w.id}')">✕</button>`:''}
    </div>
    <div id="dz-${w.id}" style="min-height:52px;background:#fff;border:2px dashed var(--brd);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start" ${isCoach()?`ondragover="oDO(event)" ondrop="oDr(event,${p.id},'${w.id}')" ondragleave="this.style.borderColor='var(--brd)'"`:''}>
      ${(w.principes||[]).map(pr=>{const f=S.principes.find(x=>x.label===pr);return`<span class="chip ${f?f.color:'chip-blue'}">${pr}${isCoach()?`<em style="cursor:pointer;opacity:.4;font-style:normal;margin-left:3px" onclick="delPr(${p.id},'${w.id}','${pr}')">×</em>`:''}</span>`;}).join('')}
      ${!(w.principes||[]).length?`<span style="font-size:12px;color:var(--t3);font-style:italic">${isCoach()?'Sleep principes...':'Geen.'}</span>`:''}
    </div>
    <div style="margin-top:10px">
      <div style="font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px;display:flex;justify-content:space-between">ACTIEPUNTEN ${isCoach()?`<button class="btn bg xs" onclick="S.activeWerkpuntId='${w.id}';om('addActie')">+ Actie</button>`:''}</div>
      ${(w.acties||[]).map((a,ai)=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--brd);font-size:13px">
        <div style="width:18px;height:18px;border-radius:5px;border:2px solid var(--brd);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;${a.done?'background:#2EAA6A;border-color:#2EAA6A;color:#fff':''}" onclick="${isCoach()?`togActie(${p.id},'${w.id}',${ai})`:''}">${a.done?'✓':''}</div>
        <span style="flex:1;${a.done?'text-decoration:line-through;opacity:.5':''}">${a.t}</span>
        <span style="font-size:11px;padding:1px 7px;border-radius:20px;background:var(--bg);border:1px solid var(--brd);color:var(--t3);margin-left:auto;flex-shrink:0">${a.p}</span>
        ${isCoach()?`<button class="btn bg xs" style="margin-left:4px" onclick="delActie(${p.id},'${w.id}',${ai})">✕</button>`:''}
      </div>`).join('')}
    </div>
    <div style="margin-top:10px">
      <div style="font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px">COACH FEEDBACK</div>
      ${isCoach()?`<textarea id="fb-${w.id}" style="width:100%;padding:9px 12px;font-size:13px;font-family:var(--f);border:1px solid var(--brd);border-radius:8px;background:#fff;color:var(--txt);resize:vertical;min-height:65px" placeholder="Feedback...">${w.feedback||''}</textarea>
      <button class="btn bg sm" style="margin-top:5px" onclick="saveFB(${p.id},'${w.id}')">Opslaan</button>`:
      `<div style="background:#E6F4FB;border-radius:7px;padding:10px;font-size:13px;color:#2B7FA8">${w.feedback||'Nog geen feedback.'}</div>`}
    </div>
  </div>`).join('');
}

// POP list met bewerk-knop
function renderPopList(p){
  if(!(p.popHistory||[]).length)return`<div style="font-size:13px;color:var(--t3);padding:12px 0">Geen gesprekken.</div>`;
  return p.popHistory.map((h,hi)=>`<div style="background:#fff;border:1px solid var(--brd);border-radius:8px;padding:14px;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:700">${h.date||''}</span>
      <span class="bdg ${h.type==='POP'?'blue':h.type==='PAP'?'green':'gray'}">${h.type}</span>
      ${isCoach()?`
        <button class="btn bg xs" style="margin-left:auto" onclick="openEditPop(${p.id},${hi})">✏ Bewerken</button>
        <button class="btn bg xs" onclick="delPOP(${p.id},'${h.id||''}',${hi})">✕</button>`:''}
    </div>
    <div style="font-size:13px;color:var(--t2);line-height:1.6">
      <div style="margin-bottom:4px"><strong>Goed:</strong> ${h.goed||'—'}</div>
      <div style="margin-bottom:4px"><strong>Werkpunten:</strong> ${h.werkpunten||'—'}</div>
      <div><strong>Afspraken:</strong> ${h.acties||'—'}</div>
    </div>
  </div>`).join('');
}

// POP bewerken
function openEditPop(pid, hi){
  const p=S.players.find(x=>x.id==pid);
  const h=p?.popHistory[hi];
  if(!h)return;
  document.getElementById('ePopDate').value=h.date||'';
  document.getElementById('ePopType').value=h.type||'POP';
  document.getElementById('ePopGoed').value=h.goed||'';
  document.getElementById('ePopWp').value=h.werkpunten||'';
  document.getElementById('ePopActie').value=h.acties||'';
  document.getElementById('m-editPop').dataset.pid=pid;
  document.getElementById('m-editPop').dataset.hi=hi;
  document.getElementById('m-editPop').dataset.id=h.id||'';
  om('editPop');
}
async function saveEditPop(){
  const pid=document.getElementById('m-editPop').dataset.pid;
  const hi=parseInt(document.getElementById('m-editPop').dataset.hi);
  const id=document.getElementById('m-editPop').dataset.id;
  const p=S.players.find(x=>x.id==pid);if(!p)return;
  const updated={date:document.getElementById('ePopDate').value,type:document.getElementById('ePopType').value,goed:document.getElementById('ePopGoed').value,werkpunten:document.getElementById('ePopWp').value,acties:document.getElementById('ePopActie').value};
  if(id){syncing(true);await sb.q('pop_history').update(updated,id);syncing(false);}
  p.popHistory[hi]={...p.popHistory[hi],...updated};
  cm('editPop');
  const el=document.getElementById('popl-'+pid);if(el)el.innerHTML=renderPopList(p);
  if(document.getElementById('pg-pop').classList.contains('active'))renderPopPage();
  notify('POP/PAP bijgewerkt');
}

// Player actions
function onDS(e){e.dataTransfer.setData('text/plain',e.target.dataset.label);}
function oDO(e){e.preventDefault();e.currentTarget.style.borderColor='#4FA8D1';}
async function oDr(e,pid,wpId){e.preventDefault();e.currentTarget.style.borderColor='var(--brd)';const lbl=e.dataTransfer.getData('text/plain');const p=S.players.find(x=>x.id==pid),w=(p?.werkpunten||[]).find(x=>x.id==wpId);if(w&&!(w.principes||[]).includes(lbl)){w.principes=[...(w.principes||[]),lbl];await savWP(w,pid);document.getElementById('wpl-'+pid).innerHTML=renderWPs(p);}}
async function delPr(pid,wpId,lbl){const p=S.players.find(x=>x.id==pid),w=(p?.werkpunten||[]).find(x=>x.id==wpId);if(w){w.principes=(w.principes||[]).filter(x=>x!==lbl);await savWP(w,pid);document.getElementById('wpl-'+pid).innerHTML=renderWPs(p);}}
async function togActie(pid,wpId,ai){const p=S.players.find(x=>x.id==pid),w=(p?.werkpunten||[]).find(x=>x.id==wpId);if(w){w.acties[ai].done=!w.acties[ai].done;await savWP(w,pid);document.getElementById('wpl-'+pid).innerHTML=renderWPs(p);}}
async function saveFB(pid,wpId){const p=S.players.find(x=>x.id==pid),w=(p?.werkpunten||[]).find(x=>x.id==wpId);if(w){w.feedback=document.getElementById('fb-'+wpId)?.value;await savWP(w,pid);notify();}}
async function delWP(pid,wpId){const p=S.players.find(x=>x.id==pid);if(!p)return;if(String(wpId).indexOf('local_')===-1)await sb.q('werkpunten').del(wpId);p.werkpunten=(p.werkpunten||[]).filter(w=>w.id!=wpId);document.getElementById('wpl-'+pid).innerHTML=renderWPs(p);notify('Verwijderd');}
async function delActie(pid,wpId,ai){const p=S.players.find(x=>x.id==pid),w=(p?.werkpunten||[]).find(x=>x.id==wpId);if(w){w.acties.splice(ai,1);await savWP(w,pid);document.getElementById('wpl-'+pid).innerHTML=renderWPs(p);}}
async function delPOP(pid,id,hi){const p=S.players.find(x=>x.id==pid);if(!p)return;if(id)await sb.q('pop_history').del(id);p.popHistory.splice(hi,1);const el=document.getElementById('popl-'+pid);if(el)el.innerHTML=renderPopList(p);if(document.getElementById('pg-pop').classList.contains('active'))renderPopPage();notify('Gesprek verwijderd');}
async function togglePres(pid,idx){const p=S.players.find(x=>x.id==pid);if(!p)return;const cyc=['present','absent','injury','match'];p.presence[idx]=cyc[(cyc.indexOf(p.presence[idx])+1)%cyc.length];await savPl(p);renderPlayerDetail(p);}
async function addPres(pid){const p=S.players.find(x=>x.id==pid);if(!p)return;p.presence=[...(p.presence||[]),'present'];await savPl(p);renderPlayerDetail(p);}
async function doSaveWeight(pid){const val=parseFloat(document.getElementById('nwv')?.value);if(!val)return;const p=S.players.find(x=>x.id==pid);if(!p)return;syncing(true);await sb.q('weight_history').insert({player_id:pid,weight_kg:val,measured_at:new Date().toISOString()});syncing(false);const d=new Date();p.weight.push({d:d.getDate()+' '+['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()],w:val});renderPlayerDetail(p);notify('✓ Gewicht opgeslagen');}
function openEditKpi(pid){const p=S.players.find(x=>x.id==pid);document.getElementById('ekf').innerHTML=`<p style="font-size:13px;color:var(--t2);margin-bottom:12px">KPI voor <strong>${p.name}</strong></p>`+S.kpis.map(k=>`<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px">${k.name}</label><input type="number" id="ek-${k.id}" style="width:100%;padding:8px;font-size:13px;border:1px solid var(--brd);border-radius:7px;background:var(--bg)" value="${p.kpis?.[k.id]||k.default_val}"></div>`).join('');document.getElementById('ekf').dataset.pid=pid;om('editKpi');}
async function saveKpiVals(){const pid=document.getElementById('ekf').dataset.pid;const p=S.players.find(x=>x.id==pid);if(!p)return;p.kpis=p.kpis||{};S.kpis.forEach(k=>{const v=document.getElementById('ek-'+k.id)?.value;if(v!==undefined)p.kpis[k.id]=parseFloat(v);});await savPl(p);cm('editKpi');renderPlayerDetail(p);notify('KPI opgeslagen');}
async function savPl(p){syncing(true);await sb.q('players').update({name:p.name,pos:p.pos,age:p.age,weight_kg:(p.weight||[])[(p.weight||[]).length-1]?.w,kpis:p.kpis,presence:p.presence,color:p.color,injury:p.injury},p.id);syncing(false);}
async function savWP(w,pid){syncing(true);const pay={player_id:pid,text:w.text,cat:w.cat,principes:w.principes,acties:w.acties,feedback:w.feedback};if(w.id&&String(w.id).indexOf('local_')===-1)await sb.q('werkpunten').update(pay,w.id);else{const{data}=await sb.q('werkpunten').insert(pay);if(data?.id)w.id=data.id;}syncing(false);}

// Werkpunten overzicht pagina — met speler selectie
function renderWerkpuntenPage(){
  const el=document.getElementById('pg-werkpunten');
  const rows=[];
  S.players.forEach(p=>(p.werkpunten||[]).forEach(w=>{
    const done=(w.acties||[]).filter(a=>a.done).length,tot=(w.acties||[]).length||1;
    rows.push(`<tr onclick="openPlayer(${p.id})" style="cursor:pointer"><td><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">${ini(p.name)}</div><b>${p.name}</b></div></td><td>${p.pos||'—'}</td><td>${w.text}</td><td><span class="bdg blue">${w.cat}</span></td><td>${done}/${(w.acties||[]).length}</td><td><div style="height:7px;background:var(--bg);border-radius:4px;overflow:hidden;width:80px"><div style="height:100%;background:#4FA8D1;width:${Math.round(done/tot*100)}%"></div></div></td></tr>`);
  }));
  el.innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <div style="font-family:var(--fc);font-size:16px;font-weight:700;margin-bottom:14px">Werkpunt toevoegen aan speler</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:flex-end">
        <div><label style="font-size:12px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px">Speler</label>
          <select id="wpDirectSpeler" class="fsel" style="width:100%">${S.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
        <div><label style="font-size:12px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px">Werkpunt</label>
          <input id="wpDirectText" class="sinput" placeholder="bv. Timing dieptepass" style="width:100%"></div>
        <div><label style="font-size:12px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px">Categorie</label>
          <select id="wpDirectCat" class="fsel" style="width:100%"><option>Passing & Receiving</option><option>Finishing</option><option>Positiespel</option><option>Pressing</option><option>Fysiek</option><option>Mentaal</option></select></div>
        <button class="btn bp" onclick="addWerkpuntDirect()" style="white-space:nowrap">+ Toevoegen</button>
      </div>
    </div>
    <div class="card"><table class="tbl"><thead><tr><th>Speler</th><th>Pos</th><th>Werkpunt</th><th>Cat</th><th>Acties</th><th>Voortgang</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" style="color:var(--t3);text-align:center;padding:20px">Geen werkpunten. Voeg er één toe via het formulier hierboven.</td></tr>'}</tbody></table></div>`;
  
  // Fix typen in input veld
  document.getElementById('wpDirectText').addEventListener('keydown', e=>e.stopPropagation());
}

async function addWerkpuntDirect(){
  const pid=document.getElementById('wpDirectSpeler')?.value;
  const text=document.getElementById('wpDirectText')?.value.trim();
  const cat=document.getElementById('wpDirectCat')?.value;
  if(!pid||!text){notify('Vul speler en werkpunt in','#E05252');return;}
  const p=S.players.find(x=>x.id==pid);if(!p)return;
  const wp={text,cat,principes:[],acties:[],feedback:''};
  syncing(true);
  const{data}=await sb.q('werkpunten').insert({player_id:pid,...wp});
  syncing(false);
  wp.id=data?.id||'local_'+Date.now();
  p.werkpunten=[...(p.werkpunten||[]),wp];
  document.getElementById('wpDirectText').value='';
  renderWerkpuntenPage();
  notify('✓ Werkpunt toegevoegd aan '+p.name);
}

// Player dashboard (speler view)
function renderPlayerDashboard(me){
  const att=Math.round((me.presence||[]).filter(x=>x==='present').length/Math.max((me.presence||[]).length,1)*100);
  const lastW=(me.weight||[])[(me.weight||[]).length-1]?.w||'—';
  const prevW=(me.weight||[]).length>1?(me.weight||[])[me.weight.length-2]?.w:null;
  const wDiff=prevW?(lastW-prevW).toFixed(1):null;
  const actiesDone=(me.werkpunten||[]).reduce((a,w)=>(w.acties||[]).filter(x=>x.done).length+a,0);
  const actiesTotal=(me.werkpunten||[]).reduce((a,w)=>(w.acties||[]).length+a,0);
  const maxW=Math.max(...(me.weight||[{w:75}]).map(x=>x.w));
  const minW=Math.min(...(me.weight||[{w:75}]).map(x=>x.w));
  return`
    <div style="background:var(--txt);border-radius:12px;padding:24px;margin-bottom:20px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;right:0;bottom:0;width:5px;background:#4FA8D1"></div>
      ${S.clubLogo?`<img src="${S.clubLogo}" style="position:absolute;top:16px;right:20px;width:48px;height:48px;border-radius:8px;object-fit:cover;opacity:.6" alt="logo">`:``}
      <div style="width:72px;height:72px;border-radius:50%;background:${me.color||'#4FA8D1'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:#fff;flex-shrink:0;border:3px solid rgba(255,255,255,.15)">${ini(me.name)}</div>
      <div style="flex:1">
        <div style="font-family:var(--fc);font-size:26px;font-weight:700;color:#fff">${me.name}</div>
        <div style="font-size:13px;color:rgba(255,255,255,.5);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap">
          <span>⚽ ${me.pos||'—'}</span><span>🎂 ${me.age||'—'} jaar</span>
          <span>⚖️ ${lastW} kg ${wDiff?`<span style="color:${wDiff>0?'#F87171':'#4ADE80'}">(${wDiff>0?'+':''}${wDiff})</span>`:''}</span>
        </div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
          <span style="background:${att>=75?'#2EAA6A':att>=60?'#D4860A':'#E05252'};color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600">${att}% aanwezigheid</span>
          <span style="background:#4FA8D1;color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600">${(me.werkpunten||[]).length} werkpunten</span>
          ${me.injury?'<span style="background:#E05252;color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600">⚠️ Blessure</span>':''}
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      ${[['Aanwezigheid',att+'%',att>=75?'#2EAA6A':att>=60?'#D4860A':'#E05252',`${(me.presence||[]).filter(x=>x==='present').length}/${(me.presence||[]).length} sessies`],['Gewicht',lastW+' kg','#4FA8D1',wDiff?`${wDiff>0?'↑':'↓'} ${Math.abs(wDiff)} kg`:'Laatste meting'],['Actiepunten',actiesDone+'/'+actiesTotal,'#7C5CBF','Voltooid'],["POP's",(me.popHistory||[]).length+'','#D4860A','Dit seizoen']].map(([l,v,c,s])=>`<div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:3px;background:${c}"></div><div style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${l}</div><div style="font-family:var(--fc);font-size:26px;font-weight:700;color:${c};line-height:1">${v}</div><div style="font-size:11px;color:var(--t3);margin-top:3px">${s}</div></div>`).join('')}
    </div>
    <div class="g2" style="margin-bottom:16px">
      <div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:18px">
        <div style="font-family:var(--fc);font-size:16px;font-weight:700;margin-bottom:14px">🎯 Werkpunten</div>
        ${(me.werkpunten||[]).map(w=>{const wD=(w.acties||[]).filter(a=>a.done).length,wT=(w.acties||[]).length,pct=wT?Math.round(wD/wT*100):0;return`<div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:10px;border-left:3px solid #4FA8D1"><div style="font-weight:600;font-size:13px;margin-bottom:4px">${w.text}</div><div style="font-size:11px;color:var(--t3);margin-bottom:8px">${w.cat}</div>${wT?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="flex:1;height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden"><div style="height:100%;background:${pct===100?'#2EAA6A':'#4FA8D1'};width:${pct}%"></div></div><span style="font-size:11px;color:var(--t3)">${wD}/${wT}</span></div>`:''}${(w.acties||[]).map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--brd);font-size:12px"><div style="width:16px;height:16px;border-radius:4px;border:1.5px solid ${a.done?'#2EAA6A':'var(--brd)'};background:${a.done?'#2EAA6A':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:10px">${a.done?'✓':''}</div><span style="flex:1;${a.done?'text-decoration:line-through;opacity:.5':''}">${a.t}</span><span style="font-size:10px;padding:1px 6px;border-radius:20px;background:var(--bg);border:1px solid var(--brd);color:var(--t3);flex-shrink:0">${a.p}</span></div>`).join('')}${w.feedback?`<div style="margin-top:8px;background:#E6F4FB;border-radius:6px;padding:8px;font-size:12px;color:#2B7FA8"><strong>💬 Coach:</strong> ${w.feedback}</div>`:''}</div>`;}).join('')||'<div style="font-size:13px;color:var(--t3)">Nog geen werkpunten.</div>'}
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:16px"><div style="font-family:var(--fc);font-size:16px;font-weight:700;margin-bottom:12px">📊 KPI's</div>${S.kpis.map(k=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:3px;font-weight:500"><span>${k.name}</span><span style="font-weight:700;color:var(--txt)">${me.kpis?.[k.id]||k.default_val}${k.unit==='pct'?'%':k.unit==='km'?' km':''}</span></div><div style="height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;background:#4FA8D1;width:${Math.min(100,k.unit==='km'?(me.kpis?.[k.id]||k.default_val)/12*100:(me.kpis?.[k.id]||k.default_val))}%"></div></div></div>`).join('')}</div>
        <div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:16px"><div style="font-family:var(--fc);font-size:16px;font-weight:700;margin-bottom:10px">⚖️ Gewicht</div><div style="display:flex;align-items:flex-end;gap:6px;height:64px">${(me.weight||[]).slice(-6).map(w=>{const h=maxW===minW?40:Math.round(14+((w.w-minW)/(maxW-minW))*46);return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:100%;background:#4FA8D1;border-radius:3px 3px 0 0;height:${h}px;position:relative"><span style="position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:#2B7FA8;white-space:nowrap">${w.w}</span></div><div style="font-size:8px;color:var(--t3)">${w.d}</div></div>`;}).join('')}</div></div>
        <div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:16px"><div style="font-family:var(--fc);font-size:16px;font-weight:700;margin-bottom:8px">📅 Aanwezigheid</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${(me.presence||[]).slice(-14).map((s,i)=>{const bg=s==='present'?'#D1FAE5':s==='absent'?'#FEE2E2':s==='injury'?'#FEF3C7':'#E6F4FB';const c=s==='present'?'#065F46':s==='absent'?'#991B1B':s==='injury'?'#92400E':'#2B7FA8';return`<div style="aspect-ratio:1;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:${c}">${i%2===0?'T':'W'}</div>`;}).join('')}</div></div>
      </div>
    </div>
    ${(me.popHistory||[]).length?`<div style="background:#fff;border:1px solid var(--brd);border-radius:10px;padding:18px"><div style="font-family:var(--fc);font-size:16px;font-weight:700;margin-bottom:14px">💬 POP/PAP</div>${(me.popHistory||[]).slice(0,3).map(h=>`<div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px"><div style="display:flex;gap:8px;margin-bottom:6px"><span style="font-size:12px;font-weight:700">${h.date||''}</span><span class="bdg ${h.type==='POP'?'blue':h.type==='PAP'?'green':'gray'}">${h.type}</span></div><div style="font-size:12px;color:var(--t2);line-height:1.6">${h.goed?`<div>✅ <strong>Sterk:</strong> ${h.goed}</div>`:''} ${h.werkpunten?`<div>🎯 <strong>WP:</strong> ${h.werkpunten}</div>`:''} ${h.acties?`<div>📋 <strong>Actie:</strong> ${h.acties}</div>`:''}</div></div>`).join('')}</div>`:''}`;
}

</script>
<script>
// ============================================================
// WERKPUNTEN / POP / FYSIEK / KPI
// ============================================================
function renderFysiek(){
  document.getElementById('pg-fysiek').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-family:var(--fc);font-size:17px;font-weight:700">Fysiek & KPI</div><button class="btn bg sm" onclick="nav('kpibeheer',null)">⚙ KPI's beheren</button></div>
    <div class="card"><table class="tbl"><thead><tr><th>Speler</th><th>Pos</th><th>Gewicht</th>${S.kpis.map(k=>`<th>${k.name}</th>`).join('')}<th></th></tr></thead>
    <tbody>${S.players.map(p=>`<tr onclick="openPlayer(${p.id})" style="cursor:pointer">
      <td><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">${ini(p.name)}</div><b>${p.name}</b></div></td>
      <td>${p.pos||'—'}</td><td>${(p.weight||[])[(p.weight||[]).length-1]?.w||'—'} kg</td>
      ${S.kpis.map(k=>`<td>${p.kpis?.[k.id]||k.default_val}${k.unit==='pct'?'%':k.unit==='km'?' km':''}</td>`).join('')}
      <td><button class="btn bg xs" onclick="event.stopPropagation();openEditKpi(${p.id})">✏</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function renderKpiBeheer(){
  document.getElementById('pg-kpibeheer').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-family:var(--fc);font-size:17px;font-weight:700">KPI & Principes</div><button class="btn bp sm" onclick="om('addKpi')">+ KPI</button></div>
    <div class="card" style="margin-bottom:16px"><div class="ctitle">Actieve KPI's</div>
      ${S.kpis.map((k,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--brd)">
        <div style="flex:1;font-weight:600">${k.name}</div><span class="bdg gray">${k.unit}</span>
        <input value="${k.name}" style="padding:5px 8px;font-size:13px;border:1px solid var(--brd);border-radius:6px;background:var(--bg);width:160px" onchange="S.kpis[${i}].name=this.value">
        <button class="btn bg xs" onclick="delKpi('${k.id}')">✕</button>
      </div>`).join('')}
    </div>
    <div class="card"><div class="ctitle">Principes</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${S.principes.map(pr=>`<span class="chip ${pr.color}">${pr.label}<em style="cursor:pointer;opacity:.4;font-style:normal;margin-left:3px" onclick="delPrincipe('${pr.id}')">×</em></span>`).join('')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="npt" class="sinput" placeholder="Nieuw principe..." style="flex:1">
        <select id="npc" class="fsel"><option value="chip-blue">Technisch (blauw)</option><option value="chip-green">Afwerking (groen)</option><option value="chip-amber">Verdedigend (amber)</option></select>
        <button class="btn bp sm" onclick="addPrincipe()">Toevoegen</button>
      </div>
    </div>`;
}

async function delKpi(id){await sb.q('kpis').del(id);S.kpis=S.kpis.filter(k=>k.id!==id);renderKpiBeheer();notify('KPI verwijderd');}
async function delPrincipe(id){await sb.q('principes').del(id);S.principes=S.principes.filter(p=>String(p.id)!==String(id));renderKpiBeheer();notify('Principe verwijderd');}
async function addPrincipe(){const l=document.getElementById('npt').value.trim();if(!l)return;const c=document.getElementById('npc').value;const{data}=await sb.q('principes').insert({label:l,color:c});if(data)S.principes.push({...data,label:l,color:c});document.getElementById('npt').value='';renderKpiBeheer();notify();}

function renderPopPage(){
  const mf=document.getElementById('pmf')?.value||'';
  const tf=document.getElementById('ptf')?.value||'';
  const pf=document.getElementById('ppf')?.value||'';
  const all=[];S.players.forEach(p=>(p.popHistory||[]).forEach(h=>all.push({...h,player:p})));
  const filt=all.filter(h=>(!mf||h.date?.startsWith(mf))&&(!tf||h.type===tf)&&(!pf||h.player.id==pf)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const withPop=S.players.filter(p=>(p.popHistory||[]).length>0).length;
  document.getElementById('pg-pop').innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <select class="fsel" id="pmf" onchange="renderPopPage()"><option value="">Alle maanden</option>${['2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'].map(m=>`<option value="${m}" ${mf===m?'selected':''}>${m}</option>`).join('')}</select>
      <select class="fsel" id="ptf" onchange="renderPopPage()"><option value="">Alle types</option><option value="POP" ${tf==='POP'?'selected':''}>POP</option><option value="PAP" ${tf==='PAP'?'selected':''}>PAP</option><option value="Check-in" ${tf==='Check-in'?'selected':''}>Check-in</option></select>
      <select class="fsel" id="ppf" onchange="renderPopPage()"><option value="">Alle spelers</option>${S.players.map(p=>`<option value="${p.id}" ${pf==p.id?'selected':''}>${p.name}</option>`).join('')}</select>
      <button class="btn bp sm" onclick="om('addPop')">+ Gesprek</button>
    </div>
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="stat"><div class="slbl">Totaal</div><div class="sval">${all.length}</div></div>
      <div class="stat"><div class="slbl">Met gesprek</div><div class="sval">${withPop}</div></div>
      <div class="stat"><div class="slbl">Te plannen</div><div class="sval">${S.players.length-withPop}</div></div>
    </div>
    ${filt.map(h=>`<div style="background:#fff;border:1px solid var(--brd);border-radius:8px;padding:14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <div style="width:32px;height:32px;border-radius:50%;background:${h.player.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0">${ini(h.player.name)}</div>
        <span style="font-weight:600">${h.player.name}</span><span class="bdg gray">${h.player.pos||'—'}</span>
        <span style="font-size:13px;font-weight:700">${h.date||''}</span>
        <span class="bdg ${h.type==='POP'?'blue':h.type==='PAP'?'green':'gray'}">${h.type}</span>
        <button class="btn bg xs" style="margin-left:auto" onclick="openEditPopGlobal('${h.player.id}','${h.id||''}')">✏ Bewerken</button>
      </div>
      <div style="font-size:13px;color:var(--t2);line-height:1.6"><div style="margin-bottom:4px"><strong>Goed:</strong> ${h.goed||'—'}</div><div style="margin-bottom:4px"><strong>Werkpunten:</strong> ${h.werkpunten||'—'}</div><div><strong>Afspraken:</strong> ${h.acties||'—'}</div></div>
    </div>`).join('')||'<div style="color:var(--t3);font-size:13px;padding:20px;text-align:center">Geen gesprekken gevonden.</div>'}`;
}

function openEditPopGlobal(pid,id){
  const p=S.players.find(x=>x.id==pid);
  const h=p?.popHistory.find(x=>x.id==id)||p?.popHistory[0];
  if(!h)return;
  const hi=p.popHistory.indexOf(h);
  document.getElementById('ePopDate').value=h.date||'';
  document.getElementById('ePopType').value=h.type||'POP';
  document.getElementById('ePopGoed').value=h.goed||'';
  document.getElementById('ePopWp').value=h.werkpunten||'';
  document.getElementById('ePopActie').value=h.acties||'';
  document.getElementById('m-editPop').dataset.pid=pid;
  document.getElementById('m-editPop').dataset.hi=hi;
  document.getElementById('m-editPop').dataset.id=id;
  om('editPop');
}

// ============================================================
// TRAINING — met individuele sessie koppeling
// ============================================================
function renderTraining(){
  const dates=getWeekDates();
  const dnames=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
  const months=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const key=S.weekOffset;const ws=S.weekSessions[key]||{};
  // Verzamel alle individuele sessies
  const indivAll=Object.entries(ws).flatMap(([day,sessions])=>sessions.filter(s=>s.type==='indiv').map(s=>({...s,day:parseInt(day)})));
  document.getElementById('pg-training').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn bg sm" onclick="chWk(-1)">◀</button>
        <div style="font-family:var(--fc);font-size:17px;font-weight:700">Week ${1+S.weekOffset} — ${months[dates[0].getMonth()]} ${dates[0].getFullYear()}</div>
        <button class="btn bg sm" onclick="chWk(1)">▶</button>
      </div>
      <button class="btn bp sm" onclick="om('addSession')">+ Sessie toevoegen</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px">
      ${dates.map((d,i)=>`<div style="background:#fff;border:1px solid var(--brd);border-radius:8px;padding:12px;min-height:130px">
        <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between">${dnames[i]} ${d.getDate()}/${d.getMonth()+1}
          <span style="cursor:pointer;opacity:.4;font-size:16px" onclick="prefillSessionDay(${i})">+</span>
        </div>
        ${(ws[i]||[]).map(s=>{const tc=s.type==='match'?'#FEF3C7':s.type==='indiv'?'#D1FAE5':s.type==='rest'?'var(--bg)':'#E6F4FB';const c=s.type==='match'?'#92400E':s.type==='indiv'?'#065F46':s.type==='rest'?'var(--t3)':'#2B7FA8';return`<div style="background:${tc};border-radius:6px;padding:6px 8px;margin-bottom:5px;position:relative" onmouseenter="this.querySelector('.sdel').style.display='flex'" onmouseleave="this.querySelector('.sdel').style.display='none'">
          <div style="font-size:12px;font-weight:600;color:${c}">${s.title}</div><div style="font-size:10px;color:${c};opacity:.7">${s.time||''}</div>
          <span class="sdel" style="display:none;position:absolute;top:3px;right:3px;background:rgba(0,0,0,.25);color:#fff;border-radius:50%;width:15px;height:15px;align-items:center;justify-content:center;font-size:9px;cursor:pointer" onclick="delSess('${s.id}',${key},${i})">✕</span>
        </div>`;}).join('')}
        ${!(ws[i]||[]).length?'<div style="font-size:11px;color:var(--t3);font-style:italic">Vrij</div>':''}
      </div>`).join('')}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="ctitle" style="margin:0">Individuele sessies deze week</div>
        <button class="btn bp sm" onclick="document.getElementById('sesType').value='indiv';om('addSession')">+ Individuele sessie</button>
      </div>
      ${indivAll.length?`<table class="tbl"><thead><tr><th>Speler</th><th>Dag</th><th>Tijd</th><th>Notitie</th><th></th></tr></thead><tbody>
        ${indivAll.map(s=>`<tr>
          <td><strong>${s.title.replace('Individuele sessie: ','').replace('Individueel: ','')}</strong></td>
          <td>${dnames[s.day]||'—'}</td>
          <td>${s.time||'—'}</td>
          <td style="color:var(--t3)">${s.note||'—'}</td>
          <td><button class="btn bg xs" onclick="delSess('${s.id}',${key},${s.day})">✕</button></td>
        </tr>`).join('')}
      </tbody></table>`:'<div style="font-size:13px;color:var(--t3)">Geen individuele sessies. Klik "+ Individuele sessie" om er een toe te voegen.</div>'}
    </div>`;
}

function prefillSessionDay(day){document.getElementById('sesDay').value=day;om('addSession');}

async function importCSV(){const raw=document.getElementById('csvPaste').value.trim();if(!raw)return;const lines=raw.split('\n');const hdr=lines[0].split(',').map(h=>h.trim().toLowerCase());let cnt=0;for(const line of lines.slice(1)){const vals=line.split(',').map(v=>v.trim());const obj={};hdr.forEach((h,i)=>obj[h]=vals[i]);const name=obj['oefenvorm']||obj['naam']||'Onbekend';const load={dist:parseFloat(obj['afstand(km)']||obj['afstand']||0),hsr:parseFloat(obj['hsr(m)']||obj['hsr']||0),spr:parseFloat(obj['sprints']||0),rpe:parseFloat(obj['rpe']||0)};let ex=S.oefenvormen.find(o=>o.name.toLowerCase()===name.toLowerCase());if(!ex){const{data}=await sb.q('oefenvormen').insert({name,cat:'Onbekend',dur:parseFloat(obj['duur(min)']||0),intens:'middel',load,principes:[],video_url:null});if(data){S.oefenvormen.push({...data,loadHistory:[]});ex=S.oefenvormen[S.oefenvormen.length-1];}}if(ex){ex.load=load;await sb.q('oef_load_history').insert({oefenvorm_id:ex.id,session_date:new Date().toISOString().split('T')[0],dist_km:load.dist,hsr_m:load.hsr,sprints:load.spr,rpe:load.rpe});cnt++;}}const r=document.getElementById('impRes');r.style.display='block';r.textContent=`✓ ${cnt} rijen verwerkt`;renderOefenvormen();notify(cnt+' oefenvormen geïmporteerd');}

    const cats={};pl.forEach(p=>(p.werkpunten||[]).forEach(w=>{cats[w.cat]=(cats[w.cat]||0)+1;}));
    const c2=document.getElementById('chWp');if(c2&&Object.keys(cats).length)S.charts['chWp']=new Chart(c2,{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#4FA8D1','#2EAA6A','#D4860A','#E05252','#7C5CBF','#16A085']}]},options:{responsive:true,maintainAspectRatio:false}});
    const k0=S.kpis[0];const c3=document.getElementById('chKpi');if(c3&&k0)S.charts['chKpi']=new Chart(c3,{type:'bar',data:{labels:pl.map(p=>p.name.split(' ')[0]),datasets:[{label:k0.name,data:pl.map(p=>p.kpis?.[k0.id]||k0.default_val),backgroundColor:'rgba(46,170,106,.6)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});

function doExport(type){
  let lines=[];
  const logo=S.clubName||'Belisia SV';
  if(type==='pop'){lines=[`${logo} — POP/PAP RAPPORT`,'='.repeat(50),'Gegenereerd: '+new Date().toLocaleDateString('nl-BE'),''];S.players.forEach(p=>{if(!(p.popHistory||[]).length)return;lines.push(`${p.name} (${p.pos||'—'})`);lines.push('-'.repeat(30));(p.popHistory||[]).forEach(h=>{lines.push(`${h.date} — ${h.type}`);lines.push(`Goed: ${h.goed||'—'}`);lines.push(`Werkpunten: ${h.werkpunten||'—'}`);lines.push(`Afspraken: ${h.acties||'—'}`);lines.push('');});});}
  else if(type==='players'){lines=[['Naam','Pos','Leeftijd','Gewicht',...S.kpis.map(k=>k.name),'Aanwezigheid%','Werkpunten'].join(',')];S.players.forEach(p=>lines.push([p.name,p.pos||'—',p.age||'—',(p.weight||[])[(p.weight||[]).length-1]?.w||'—',...S.kpis.map(k=>p.kpis?.[k.id]||k.default_val),Math.round((p.presence||[]).filter(x=>x==='present').length/Math.max((p.presence||[]).length,1)*100),(p.werkpunten||[]).length].join(',')));}
  else if(type==='portfolio'){lines=[`${logo} — COACH PORTFOLIO`,'='.repeat(50),''];lines.push('CARRIÈRELIJN:');S.carriere.forEach(c=>lines.push(`${c.year} — ${c.title} @ ${c.club}${c.description?' | '+c.description:''}`));lines.push('');lines.push('COMPETENTIES: '+S.competenties.join(', '));lines.push('');lines.push('REFLECTIES:');S.reflecties.forEach(r=>lines.push(`${r.date}: ${r.text}`));}
  else if(type==='training'){lines=[`${logo} — TRAININGSPLAN`,'='.repeat(50),''];Object.entries(S.weekSessions).forEach(([wk,days])=>{lines.push(`Week ${parseInt(wk)+1}:`);Object.entries(days).forEach(([d,sessions])=>{if(sessions?.length)sessions.forEach(s=>lines.push(`  Dag ${parseInt(d)+1}: [${s.type}] ${s.title} ${s.time||''}`));});lines.push('');});}
  document.getElementById('expOut').style.display='block';
  document.getElementById('expTxt').textContent=lines.join('\n');
  document.getElementById('expOut').scrollIntoView({behavior:'smooth'});
}

function doPdfExport(type){
  doExport(type);
  setTimeout(()=>{
    const text=document.getElementById('expTxt')?.textContent||'';
    const logo=S.clubName||'Belisia SV';
    const win=window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>${logo} Export</title><style>body{font-family:'Barlow',sans-serif;padding:40px;color:#161F2B;max-width:800px;margin:0 auto}h1{font-size:24px;font-weight:700;margin-bottom:4px}h2{font-size:14px;color:#94A3B8;font-weight:400;margin-bottom:24px}pre{font-size:13px;line-height:1.7;white-space:pre-wrap;font-family:monospace}.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #4FA8D1}@media print{button{display:none}}</style></head><body>
    <div class="header">${S.clubLogo?`<img src="${S.clubLogo}" style="width:56px;height:56px;border-radius:8px;object-fit:cover" alt="logo">`:''}<div><h1>${logo}</h1><h2>Performance Platform · ${new Date().toLocaleDateString('nl-BE')}</h2></div></div>
    <pre>${text}</pre>
    <br><button onclick="window.print()" style="padding:10px 20px;background:#4FA8D1;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">🖨️ Afdrukken / Opslaan als PDF</button>
    </body></html>`);
    win.document.close();
  },200);
}

    <div><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:8px">FYSIOLOGIE</div>
      <div class="ff"><label>RPE (1-10)</label><input type="number" id="oefRpe" min="1" max="10"></div>
      <div class="ff"><label>Gem. hartslag (bpm)</label><input type="number" id="oefHr"></div>
      <div class="ff"><label>Max hartslag (bpm)</label><input type="number" id="oefHrmax"></div>
      <div class="ff"><label>Video URL</label><input id="oefVidUrl" placeholder="YouTube of pad"></div>
    </div>
  </div>
  <div class="ma"><button class="btn bg" onclick="cm('addOefenvorm')">Annuleer</button><button class="btn bp" onclick="doSaveOef()">Opslaan</button></div>
</div></div>

<div class="modal-wrap" id="m-viewOef"><div class="modal" style="width:560px;max-width:96vw">
  <div id="oefViewContent"></div>
  <div class="ma"><button class="btn bg" onclick="cm('viewOef')">Sluiten</button></div>
</div></div>

<div class="modal-wrap" id="m-uploadLogo"><div class="modal">
  <div class="mtitle">Club logo uploaden</div>
  <div class="ff"><label>Club naam</label><input id="clubNameInput" placeholder="bv. Belisia SV" value="${S.clubName||'Belisia SV'}"></div>
  <div style="border:2px dashed var(--brd);border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:var(--bg);margin-bottom:12px" onclick="document.getElementById('logoFile').click()">
    ${S.clubLogo?`<img src="${S.clubLogo}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;margin-bottom:8px"><br>`:'<div style="font-size:32px;opacity:.2;margin-bottom:8px">🏟️</div>'}
    <div style="font-size:13px;color:var(--t3)">Klik om logo te selecteren</div>
    <div style="font-size:11px;color:var(--t3);margin-top:4px">PNG, JPG — max 2MB</div>
  </div>
  <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="previewLogo(this)">
  <div id="logoPreview"></div>
  <div class="ma"><button class="btn bg" onclick="cm('uploadLogo')">Annuleer</button><button class="btn bp" onclick="saveLogo()">Opslaan</button></div>
</div></div>`;

  // Close on backdrop
  document.querySelectorAll('.modal-wrap').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

  // Fill player selects when modals open
  const popObs=new MutationObserver(()=>{
    const s=document.getElementById('popSel');
    if(s&&!s.options.length)s.innerHTML=S.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    const sp=document.getElementById('sesPlayerSel');
    if(sp&&sp.options.length<=1)sp.innerHTML='<option value="">-- Kies speler --</option>'+S.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    const wd=document.getElementById('wdSpeler');
    if(wd&&!wd.options.length)wd.innerHTML=S.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  });
  ['m-addPop','m-addSession','m-addWerkpuntDirect'].forEach(id=>{const el=document.getElementById(id);if(el)popObs.observe(el,{attributes:true,attributeFilter:['class']});});
}

function toggleSesPlayer(){
  const type=document.getElementById('sesType')?.value;
  const pr=document.getElementById('sesPlayerRow');
  const tr=document.getElementById('sesTitleRow');
  if(pr)pr.style.display=type==='indiv'?'block':'none';
  if(tr)tr.style.display=type==='indiv'?'none':'block';
}

// ============================================================
// MODAL ACTION HANDLERS
// ============================================================
async function doAddSpeler(){
  const name=document.getElementById('nsName').value.trim();if(!name)return;
  syncing(true);
  const{data}=await sb.q('players').insert({name,pos:document.getElementById('nsPos').value,age:parseInt(document.getElementById('nsAge').value)||22,weight_kg:parseInt(document.getElementById('nsWt').value)||75,color:COLORS[S.players.length%COLORS.length],kpis:{},presence:[],injury:false});
  syncing(false);
  if(data){S.players.push({...data,werkpunten:[],popHistory:[],weight:[{d:'Start',w:data.weight_kg}],injuries:[]});const kc=document.getElementById('kern-count');if(kc)kc.textContent=S.players.length;}
  cm('addSpeler');renderSpelers();notify('Speler toegevoegd');
}

async function doAddWerkpunt(){
  const text=document.getElementById('wpTxt').value.trim();if(!text||S.activePlayer===null)return;
  const p=S.players.find(x=>x.id==S.activePlayer);if(!p)return;
  const wp={text,cat:document.getElementById('wpCat').value,principes:[],acties:[],feedback:''};
  const{data}=await sb.q('werkpunten').insert({player_id:p.id,...wp});
  wp.id=data?.id||'local_'+Date.now();p.werkpunten=[...(p.werkpunten||[]),wp];
  document.getElementById('wpl-'+p.id).innerHTML=renderWPs(p);
  document.getElementById('wpTxt').value='';cm('addWerkpunt');notify();
}

async function doAddWerkpuntModal(){
  const pid=document.getElementById('wdSpeler')?.value;
  const text=document.getElementById('wdTxt')?.value.trim();
  const cat=document.getElementById('wdCat')?.value;
  if(!pid||!text){notify('Vul speler en werkpunt in','#E05252');return;}
  const p=S.players.find(x=>x.id==pid);if(!p)return;
  const wp={text,cat,principes:[],acties:[],feedback:''};
  syncing(true);const{data}=await sb.q('werkpunten').insert({player_id:pid,...wp});syncing(false);
  wp.id=data?.id||'local_'+Date.now();p.werkpunten=[...(p.werkpunten||[]),wp];
  document.getElementById('wdTxt').value='';cm('addWerkpuntDirect');renderWerkpuntenPage();notify('✓ Werkpunt toegevoegd aan '+p.name);
}

async function doAddActie(){
  const t=document.getElementById('actTxt').value.trim();if(!t||S.activePlayer===null)return;
  const p=S.players.find(x=>x.id==S.activePlayer),w=(p?.werkpunten||[]).find(x=>x.id==S.activeWerkpuntId);
  if(w){w.acties=[...(w.acties||[]),{t,p:document.getElementById('actPer').value,done:false}];await savWP(w,p.id);document.getElementById('wpl-'+p.id).innerHTML=renderWPs(p);}
  document.getElementById('actTxt').value='';cm('addActie');notify();
}

async function doAddPop(){
  const pid=document.getElementById('popSel').value;const p=S.players.find(x=>x.id==pid);if(!p)return;
  const pop={date:document.getElementById('popDate').value,type:document.getElementById('popType').value,goed:document.getElementById('popGoed').value,werkpunten:document.getElementById('popWp').value,acties:document.getElementById('popActie').value};
  syncing(true);const{data}=await sb.q('pop_history').insert({player_id:pid,...pop});syncing(false);
  p.popHistory=[{...pop,id:data?.id},...(p.popHistory||[])];
  cm('addPop');
  if(document.getElementById('pg-pop').classList.contains('active'))renderPopPage();
  const ppl=document.getElementById('popl-'+pid);if(ppl)ppl.innerHTML=renderPopList(p);
  notify('POP/PAP opgeslagen');
}

async function doAddKpi(){
  const name=document.getElementById('kpiName').value.trim();if(!name)return;
  const def=parseFloat(document.getElementById('kpiDef').value)||70;
  const{data}=await sb.q('kpis').insert({name,unit:document.getElementById('kpiUnit').value,default_val:def});
  if(data)S.kpis.push({...data,name,default_val:def});
  cm('addKpi');renderKpiBeheer();notify('KPI toegevoegd');
}

async function doAddSession(){
  const key=S.weekOffset,day=parseInt(document.getElementById('sesDay').value);
  const type=document.getElementById('sesType').value;
  const pid=document.getElementById('sesPlayerSel')?.value;
  const playerName=pid?S.players.find(x=>x.id==pid)?.name:'';
  const title=type==='indiv'&&playerName?`Individueel: ${playerName}`:document.getElementById('sesTitle').value||'Sessie';
  const sess={week_offset:key,day_index:day,type,title,time:document.getElementById('sesTime').value,note:document.getElementById('sesNote').value};
  syncing(true);const{data}=await sb.q('week_sessions').insert(sess);syncing(false);
  if(!S.weekSessions[key])S.weekSessions[key]={};
  if(!S.weekSessions[key][day])S.weekSessions[key][day]=[];
  S.weekSessions[key][day].push(data||{...sess,id:'local_'+Date.now()});
  cm('addSession');renderTraining();notify();
}

async function doAddCarriere(){
  const title=document.getElementById('carTitle').value.trim();if(!title)return;
  const editIdx=document.getElementById('carYear').dataset.editIdx;
  const editId=document.getElementById('carYear').dataset.editId;
  const c={year:document.getElementById('carYear').value,title,club:document.getElementById('carClub').value,description:document.getElementById('carDesc').value,sort_order:0};
  if(editIdx!==undefined&&editIdx!==''){
    const i=parseInt(editIdx);
    if(editId)await sb.q('carriere').update(c,editId);
    S.carriere[i]={...S.carriere[i],...c};
    delete document.getElementById('carYear').dataset.editIdx;
    delete document.getElementById('carYear').dataset.editId;
  } else {
    const{data}=await sb.q('carriere').insert(c);
    S.carriere.unshift({...c,id:data?.id});
  }
  cm('addCarriere');renderPortfolio();notify();
}

async function doAddTopic(){
  const name=document.getElementById('ltName').value.trim();if(!name)return;
  const t={name,description:document.getElementById('ltDesc').value};
  const{data}=await sb.q('license_topics').insert(t);
  S.licenseTopics.push({...t,id:data?.id,videos:[]});
  cm('addTopic');renderLicentie();notify();
}

async function doAddVideo(){
  const ti=S.activeLicenseTopic;if(ti===null||ti===undefined)return;
  const t=S.licenseTopics[ti];
  const v={topic_id:t.id,title:document.getElementById('vidTitle').value,url:document.getElementById('vidUrl').value,note:document.getElementById('vidNote').value};
  const{data}=await sb.q('license_videos').insert(v);
  t.videos=[...(t.videos||[]),(data||v)];
  ['vidTitle','vidUrl','vidNote'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  cm('addVideo');renderLicentie();notify('Item toegevoegd');
}

async function doAddLeerlog(){
  const wat=document.getElementById('llWat').value.trim();if(!wat)return;
  const l={date:document.getElementById('llDate').value,topic:document.getElementById('llTopic').value,wat,hoe:document.getElementById('llHoe').value,resultaat:document.getElementById('llResultaat').value};
  // Sla op in Supabase als de tabel bestaat, anders lokaal
  try{const{data}=await sb.q('leerlog').insert(l);if(data)l.id=data.id;}catch(e){}
  if(!S.leerlog)S.leerlog=[];
  S.leerlog.unshift(l);
  cm('addLeerlog');renderLicentie();notify('Leerlog opgeslagen');
}

async function doAddReflectie(){
  const text=document.getElementById('refText').value.trim();if(!text)return;
  const r={date:document.getElementById('refDate').value,text,leerlog_ref:document.getElementById('refLeerlog').value};
  const{data}=await sb.q('reflecties').insert(r);
  S.reflecties.unshift({...r,id:data?.id});
  cm('addReflectie');renderLicentie();notify();
}

async function doSaveOef(){
  const name=document.getElementById('oefN').value.trim();if(!name)return;
  const editId=document.getElementById('oefN').dataset.editId;
  const load={dist:parseFloat(document.getElementById('oefDist').value)||0,hsr:parseFloat(document.getElementById('oefHsr').value)||0,spr:parseFloat(document.getElementById('oefSpr').value)||0,spd:parseFloat(document.getElementById('oefSpd').value)||0,rpe:parseFloat(document.getElementById('oefRpe').value)||0,hr:parseFloat(document.getElementById('oefHr').value)||0,hrmax:parseFloat(document.getElementById('oefHrmax').value)||0};
  const pay={name,cat:document.getElementById('oefCatSel').value,dur:parseInt(document.getElementById('oefDur').value)||0,field:document.getElementById('oefField').value,players:document.getElementById('oefPlayers').value,intens:document.getElementById('oefIntens').value,description:document.getElementById('oefDesc').value,load,principes:[],video_url:document.getElementById('oefVidUrl').value||null};
  if(editId){await sb.q('oefenvormen').update(pay,editId);const idx=S.oefenvormen.findIndex(o=>o.id==editId);if(idx>=0)S.oefenvormen[idx]={...S.oefenvormen[idx],...pay};delete document.getElementById('oefN').dataset.editId;}
  else{const{data}=await sb.q('oefenvormen').insert(pay);S.oefenvormen.push({...pay,id:data?.id,loadHistory:[]});}
  cm('addOefenvorm');renderOefenvormen();notify();
}

// Logo upload
function previewLogo(input){
  if(!input.files[0])return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('logoPreview').innerHTML=`<img src="${e.target.result}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;margin:8px auto;display:block">`;
    document.getElementById('uploadLogo').dataset.logoData=e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}
function saveLogo(){
  const data=document.getElementById('m-uploadLogo').dataset.logoData||document.getElementById('uploadLogo')?.dataset?.logoData;
  const name=document.getElementById('clubNameInput').value.trim()||'Belisia SV';
  if(data){S.clubLogo=data;localStorage.setItem('clubLogo',data);}
  S.clubName=name;localStorage.setItem('clubName',name);
  cm('uploadLogo');renderSidebar();notify('Logo opgeslagen');
}

</script>

// Herstel club logo en naam uit localStorage
S.clubLogo = localStorage.getItem('clubLogo') || null;
S.clubName = localStorage.getItem('clubName') || 'Belisia SV';
S.leerlog = [];

// Start de app + render modals
renderModals();
init();
</script>
